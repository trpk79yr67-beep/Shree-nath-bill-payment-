<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Bill Manager</title>
<meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Card Bill">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-180.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.top{background:#0b1220;color:white;padding:25px 18px 18px}.top h1{margin:0;font-size:27px}.top p{margin:5px 0 0;color:#aeb8c8;font-size:13px}
.nav{display:flex;gap:8px;overflow:auto;background:white;padding:10px 12px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}.nav button{border:0;background:#eef2f7;border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}.nav .on{background:#0b1220;color:white}
main{max-width:850px;margin:auto;padding:16px 13px 90px}.head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px}.head h2{margin:0;font-size:24px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:750;background:#111827;color:#fff}.blue{background:#2563eb}.light{background:#e9edf3;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.customer{background:white;border:1px solid #e4e8ef;border-radius:20px;margin-bottom:16px;overflow:hidden}.custhead{padding:16px;display:flex;justify-content:space-between;align-items:center}.custname{font-size:20px;font-weight:850}.muted{color:#6b7280;font-size:12px}
.cardstrip{display:flex;gap:12px;overflow-x:auto;padding:0 13px 15px;scroll-snap-type:x mandatory}.creditcard{min-width:310px;max-width:310px;height:190px;border-radius:22px;padding:17px;color:white;position:relative;overflow:hidden;scroll-snap-align:start;box-shadow:0 9px 25px #0b122025;background:linear-gradient(135deg,#111827,#334155)}
.creditcard:nth-child(3n+2){background:linear-gradient(135deg,#312e81,#6366f1)}.creditcard:nth-child(3n+3){background:linear-gradient(135deg,#064e3b,#0f766e)}
.ccbank{font-size:14px;font-weight:800;letter-spacing:.2px}.last4{font-size:12px;opacity:.8;margin-top:3px}.due{font-size:27px;font-weight:900;margin-top:24px}.dueLabel{font-size:11px;opacity:.75}.dueDate{font-size:12px;margin-top:3px}.ccbottom{position:absolute;left:17px;right:17px;bottom:15px;display:flex;justify-content:space-between;font-size:11px;opacity:.9}.limitbar{height:4px;background:#ffffff35;border-radius:4px;margin-top:7px}.limitbar span{display:block;height:100%;background:white;border-radius:4px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 13px 14px}.kpi{background:#f8fafc;border-radius:13px;padding:10px}.kpi b{display:block;margin-top:3px}.section{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8fafc;border-radius:15px;padding:14px}.stat .v{font-size:21px;font-weight:850;margin-top:5px}.green{color:#15803d}.red{color:#dc2626}.amber{color:#b45309}
table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px}th{color:#6b7280}
.empty{text-align:center;color:#6b7280;padding:30px}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:flex-end}.overlay.show{display:flex}.sheet{background:white;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.sheet h3{margin:0 0 14px;font-size:21px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#6b7280;font-weight:700}.field input,.field select{padding:11px;border:1px solid #dbe1e8;border-radius:11px;background:white}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;position:sticky;bottom:0;background:white;padding-top:10px}
.detail{background:#0b1220;color:white;border-radius:22px;padding:20px;margin-bottom:14px}.detail .big{font-size:34px;font-weight:900;margin-top:16px}.detail .sub{color:#aeb8c8;font-size:12px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.detailbox{background:#ffffff12;border-radius:12px;padding:10px}.detailbox b{display:block;margin-top:3px}
@media(min-width:700px){.cardstrip{gap:15px}.creditcard{min-width:340px}.overlay{align-items:center;justify-content:center}.sheet{max-width:700px;border-radius:22px}.grid{grid-template-columns:repeat(4,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<div id="loginGate" style="position:fixed;inset:0;background:#0b1220;color:white;z-index:100;display:flex;align-items:center;justify-content:center;padding:22px">
<div style="background:white;color:#111827;border-radius:24px;padding:24px;width:min(430px,100%)">
<h2 style="margin:0 0 6px">Card Bill Manager</h2><p style="color:#6b7280;margin-top:0">Mobile login</p>
<input id="loginMobile" inputmode="tel" placeholder="Mobile number" style="width:100%;padding:13px;border:1px solid #dbe1e8;border-radius:12px;margin:7px 0">
<input id="loginPass" type="password" placeholder="Password" style="width:100%;padding:13px;border:1px solid #dbe1e8;border-radius:12px;margin:7px 0">
<button onclick="loginApp()" style="width:100%;padding:13px;border:0;border-radius:12px;background:#2563eb;color:white;font-weight:800;margin-top:8px">Login / Create</button>
<p style="font-size:11px;color:#6b7280">This offline version keeps the login profile on this device. Cloud/Google sync requires OAuth configuration.</p>
</div></div>
<header class="top"><h1>Card Bill Manager</h1><p>Cards • Due dates • Statements • Profit</p></header>
<nav class="nav" id="nav"></nav><main id="app"></main>
<div class="overlay" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='cbm_cred_v1';let D=JSON.parse(localStorage.getItem(KEY)||'null')||{customers:[],cards:[],tx:[],bills:[]};let tab='cards';
const n=v=>Number(v)||0,m=v=>'₹'+n(v).toLocaleString('en-IN',{maximumFractionDigits:0}),dt=v=>v?new Date(v+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):'-';
const cust=id=>D.customers.find(x=>x.id===id),card=id=>D.cards.find(x=>x.id===id);
function save(){localStorage.setItem(KEY,JSON.stringify(D));render()}
function out(c){return n(c.opening)+D.tx.filter(t=>t.cardId===c.id&&t.kind==='spend').reduce((a,t)=>a+n(t.amount),0)-D.tx.filter(t=>t.cardId===c.id&&t.kind==='payment').reduce((a,t)=>a+n(t.amount),0)}
function avail(c){return Math.max(0,n(c.limit)-out(c))}
function days(v){return v?Math.ceil((new Date(v+'T00:00')-new Date())/86400000):null}
function nav(){let x=[['cards','My Cards'],['tx','Transactions'],['bills','Bills'],['profit','Profit']];nav.innerHTML=x.map(a=>`<button class="${tab===a[0]?'on':''}" onclick="tab='${a[0]}';render()">${a[1]}</button>`).join('')}
function render(){nav();app.innerHTML=({cards,tx,bills,profit}[tab])()}
function cards(){return `<div class="head"><h2>My Cards</h2><button class="btn blue" onclick="customerForm()">+ Customer</button></div>
${D.customers.length?D.customers.map(c=>{let cs=D.cards.filter(x=>x.customerId===c.id),total=cs.reduce((a,x)=>a+out(x),0);return `<div class="customer">
<div class="custhead"><div><div class="custname">${c.name}</div><div class="muted">${cs.length} cards • ${m(total)} outstanding</div></div><button class="btn light" onclick="cardForm('${c.id}')">+ Card</button></div>
<div class="cardstrip">${cs.length?cs.map(cc=>ccard(cc)).join(''):'<div class="empty">No cards</div>'}</div>
<div class="kpis"><div class="kpi"><span class="muted">Total Limit</span><b>${m(cs.reduce((a,x)=>a+n(x.limit),0))}</b></div><div class="kpi"><span class="muted">Available</span><b class="green">${m(cs.reduce((a,x)=>a+avail(x),0))}</b></div></div>
</div>`}).join(''):'<div class="section empty">Add a customer to start.</div>'}`}
function ccard(c){let o=out(c),a=avail(c),pct=c.limit?Math.min(100,o/c.limit*100):0,d=days(c.due);return `<div class="creditcard" onclick="detail('${c.id}')">
<div class="ccbank">${c.bank}</div><div class="last4">•••• ${c.last4}</div>
<div class="due">${m(o)}</div><div class="dueLabel">TOTAL DUE</div><div class="dueDate">${c.due?'Due '+dt(c.due):'Due date not set'} ${d!==null?(d<0?'• overdue':`• ${d} days`):''}</div>
<div class="limitbar"><span style="width:${pct}%"></span></div><div class="ccbottom"><span>Limit ${m(c.limit)}</span><span>Avail ${m(a)}</span></div></div>`}
function detail(id){let c=card(id),o=out(c),a=avail(c);show(`<div class="detail"><div>${c.bank} •••• ${c.last4}</div><div class="big">${m(o)}</div><div class="sub">TOTAL DUE</div><div class="detailgrid"><div class="detailbox"><span class="sub">Credit Limit</span><b>${m(c.limit)}</b></div><div class="detailbox"><span class="sub">Available</span><b>${m(a)}</b></div><div class="detailbox"><span class="sub">Statement</span><b>${dt(c.statement)}</b></div><div class="detailbox"><span class="sub">Due</span><b>${dt(c.due)}</b></div></div></div>
<div class="section"><b>Statement estimate</b><div class="grid" style="margin-top:10px"><div class="stat">Opening Bill<div class="v">${m(c.opening)}</div></div><div class="stat">New Spend<div class="v">${m(D.tx.filter(t=>t.cardId===id&&t.kind==='spend').reduce((a,t)=>a+n(t.amount),0))}</div></div><div class="stat">Payments<div class="v green">${m(D.tx.filter(t=>t.cardId===id&&t.kind==='payment').reduce((a,t)=>a+n(t.amount),0))}</div></div><div class="stat">Next Statement<div class="v">${m(o)}</div></div></div></div>
<div class="actions"><button class="btn light" onclick="closeM()">Close</button><button class="btn" onclick="closeM();cardForm('${c.customerId}','${id}')">Edit Card</button></div>`)}
function tx(){return `<div class="head"><h2>Transactions</h2><button class="btn blue" onclick="txForm()">+ Add</button></div><div class="section"><table><tr><th>Customer / Card</th><th>Type</th><th>Amount</th><th>Profit</th></tr>${D.tx.map(t=>{let c=card(t.cardId);let income=n(t.amount)*n(t.income)/100,cost=n(t.amount)*n(t.cost)/100;return `<tr><td>${cust(t.customerId)?.name||''}<br>${c?.bank||''} ••••${c?.last4||''}</td><td>${t.kind}</td><td>${m(t.amount)}</td><td class="green">${m(income-cost)}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">No transactions</td></tr>'}</table></div>`}
function bills(){return `<div class="head"><h2>Bills & Due</h2><button class="btn blue" onclick="billForm()">+ Bill</button></div><div class="section"><table><tr><th>Customer</th><th>Card</th><th>Bill</th><th>Paid</th><th>Due</th></tr>${D.bills.map(b=>`<tr><td>${cust(b.customerId)?.name||''}</td><td>••••${card(b.cardId)?.last4||''}</td><td>${m(b.amount)}</td><td>${m(b.paid)}</td><td>${dt(b.due)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No bills</td></tr>'}</table></div>`}
function profit(){let income=D.tx.reduce((a,t)=>a+n(t.amount)*n(t.income)/100,0),cost=D.tx.reduce((a,t)=>a+n(t.amount)*n(t.cost)/100,0);return `<div class="head"><h2>Profit</h2></div><div class="grid"><div class="stat">Income<div class="v">${m(income)}</div></div><div class="stat">Charges<div class="v">${m(cost)}</div></div><div class="stat">NET PROFIT<div class="v green">${m(income-cost)}</div></div><div class="stat">Volume<div class="v">${m(D.tx.reduce((a,t)=>a+n(t.amount),0))}</div></div></div>`}
function show(x){sheet.innerHTML=x;modal.classList.add('show')}function closeM(){modal.classList.remove('show')}
function customerForm(){show(`<h3>Add Customer</h3><div class="form"><div class="field"><label>Name</label><input id="n" placeholder="Ram"></div><div class="field"><label>Mobile</label><input id="p"></div></div><div class="actions"><button class="btn light" onclick="closeM()">Cancel</button><button class="btn blue" onclick="addC()">Save</button></div>`)}
function addC(){D.customers.push({id:crypto.randomUUID(),name:n.value.trim(),mobile:p.value.trim()});save();closeM()}
function cardForm(cid,eid){let e=eid?card(eid):null;let opts=D.customers.map(x=>`<option value="${x.id}" ${x.id===(e?.customerId||cid)?'selected':''}>${x.name}</option>`).join('');show(`<h3>${e?'Edit':'Add'} Card</h3><div class="form"><div class="field"><label>Customer</label><select id="cc">${opts}</select></div><div class="field"><label>Bank / Card</label><input id="bn" value="${e?.bank||''}" placeholder="Axis Atlas"></div><div class="field"><label>Last 4</label><input id="l4" value="${e?.last4||''}" maxlength="4"></div><div class="field"><label>Card Number (16 digits)</label><input id="cn" inputmode="numeric" maxlength="16" value="${e?.cardNumber||''}" placeholder="16-digit number"></div><div class="field"><label>Expiry (MM/YY)</label><input id="ex" maxlength="5" value="${e?.expiry||''}" placeholder="08/29"></div><div class="field"><label>CVV</label><input value="" type="password" inputmode="numeric" maxlength="4" placeholder="Not saved"></div><div class="field"><label>Total Limit</label><input id="lim" inputmode="decimal" value="${e?.limit||''}"></div><div class="field"><label>Current / Opening Bill</label><input id="op" inputmode="decimal" value="${e?.opening||''}"></div><div class="field"><label>Statement Date</label><input id="st" type="date" value="${e?.statement||''}"></div><div class="field"><label>Due Date</label><input id="du" type="date" value="${e?.due||''}"></div></div><div class="actions"><button class="btn light" onclick="closeM()">Cancel</button><button class="btn blue" onclick="saveCard('${eid||''}')">Save Card</button></div>`)}
function saveCard(id){let x={id:id||crypto.randomUUID(),customerId:cc.value,bank:bn.value,last4:l4.value,cardNumber:cn.value.replace(/\D/g,'').slice(0,16),expiry:ex.value,limit:n(lim.value),opening:n(op.value),statement:st.value,due:du.value};if(id)D.cards=D.cards.map(z=>z.id===id?x:z);else D.cards.push(x);save();closeM()}
function txForm(){let opts=D.cards.map(c=>`<option value="${c.id}">${cust(c.customerId)?.name||''} — ${c.bank} ••••${c.last4}</option>`).join('');if(!opts)return alert('Add a card first');show(`<h3>Add Transaction</h3><div class="form"><div class="field"><label>Card</label><select id="tc">${opts}</select></div><div class="field"><label>Type</label><select id="ty"><option value="spend">Spend / Withdrawal</option><option value="payment">Payment</option></select></div><div class="field"><label>Amount</label><input id="am" inputmode="decimal"></div><div class="field"><label>Withdrawal Income %</label><input id="ir" value="3"></div><div class="field"><label>Withdrawal Charges %</label><input id="cr" value="1.7"></div></div><div class="actions"><button class="btn light" onclick="closeM()">Cancel</button><button class="btn blue" onclick="saveTx()">Save</button></div>`)}
function saveTx(){let c=card(tc.value);D.tx.push({id:crypto.randomUUID(),customerId:c.customerId,cardId:c.id,kind:ty.value,amount:n(am.value),income:ty.value==='spend'?n(ir.value):0,cost:ty.value==='spend'?n(cr.value):0});save();closeM()}
function billForm(){let opts=D.cards.map(c=>`<option value="${c.id}">${cust(c.customerId)?.name||''} — ${c.bank} ••••${c.last4}</option>`).join('');show(`<h3>Add Bill</h3><div class="form"><div class="field full"><label>Card</label><select id="bc">${opts}</select></div><div class="field"><label>Bill</label><input id="ba" inputmode="decimal"></div><div class="field"><label>Paid</label><input id="bp" inputmode="decimal" value="0"></div><div class="field"><label>Due Date</label><input id="bd" type="date"></div></div><div class="actions"><button class="btn light" onclick="closeM()">Cancel</button><button class="btn blue" onclick="saveBill()">Save</button></div>`)}
function saveBill(){let c=card(bc.value);D.bills.push({id:crypto.randomUUID(),customerId:c.customerId,cardId:c.id,amount:n(ba.value),paid:n(bp.value),due:bd.value});save();closeM()}
const LOGIN_KEY='cbm_login_v1';
function loginApp(){
 const mobile=document.getElementById('loginMobile').value.trim(), pass=document.getElementById('loginPass').value;
 if(!/^\d{10}$/.test(mobile)||pass.length<4){alert('Enter a valid 10-digit mobile number and password (4+ characters).');return}
 const old=localStorage.getItem(LOGIN_KEY);
 if(old){const x=JSON.parse(old);if(x.mobile!==mobile||x.pass!==pass){alert('Mobile/password does not match this device profile.');return}}
 else localStorage.setItem(LOGIN_KEY,JSON.stringify({mobile,pass}));
 document.getElementById('loginGate').style.display='none';
}
if(localStorage.getItem(LOGIN_KEY)) document.getElementById('loginGate').style.display='none';
render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
